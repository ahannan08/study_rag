services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://study:study@postgres:5432/study_rag
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - study_data:/app/data
    depends_on:
      - postgres

volumes:
  pgdata:
  study_data:
