services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://study:study@postgres:5432/study_rag
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - study_data:/app/data
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: python -m app.worker.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://study:study@postgres:5432/study_rag
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - study_data:/app/data
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  study_data:
